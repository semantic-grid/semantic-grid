apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-meta-v2
  labels:
    app.kubernetes.io/name: db-meta-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-meta-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-meta-v2
    spec:
      containers:
        - name: db-meta-v2
          image: db-meta-v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: db-meta-v2
            - secretRef:
                name: db-meta # Reuse existing db-meta secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: db-meta-v2
  labels:
    app.kubernetes.io/name: db-meta-v2
spec:
  selector:
    app.kubernetes.io/name: db-meta-v2
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
