apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-meta-v2
  labels:
    app.kubernetes.io/name: db-meta-v2
spec:
  replicas: 1
  strategy:
    type: Recreate # Required for single-replica with PVC (can't multi-attach)
  selector:
    matchLabels:
      app.kubernetes.io/name: db-meta-v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-meta-v2
    spec:
      securityContext:
        fsGroup: 65534 # nobody group - makes PVC writable
      containers:
        - name: db-meta-v2
          image: db-meta-v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: db-meta-v2
            - secretRef:
                name: semantic-grid-db-meta # Existing db-meta secret (full name, not managed by this kustomize)
          volumeMounts:
            - name: providers-data
              mountPath: /data/providers
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: providers-data
          persistentVolumeClaim:
            claimName: db-meta-v2-providers
---
apiVersion: v1
kind: Service
metadata:
  name: db-meta-v2
  labels:
    app.kubernetes.io/name: db-meta-v2
spec:
  selector:
    app.kubernetes.io/name: db-meta-v2
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
