<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #333; stroke-width: 2; }
      .box-entry { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .box-process { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .box-decision { fill: #fce4ec; stroke: #c2185b; stroke-width: 2; }
      .box-output { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
      .text { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; }
      .text-bold { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; font-weight: bold; }
      .text-small { font-family: system-ui, sans-serif; font-size: 10px; fill: #666; }
      .text-title { font-family: system-ui, sans-serif; font-size: 16px; fill: #333; font-weight: bold; }
      .line { stroke: #333; stroke-width: 1.5; fill: none; }
      .arrow { fill: #333; }
    </style>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" class="text-title">db-meta-v2 Tools</text>

  <!-- Entry points -->
  <rect x="30" y="50" width="150" height="40" rx="6" class="box-entry"/>
  <text x="105" y="67" text-anchor="middle" class="text-bold">get_data(intent)</text>
  <text x="105" y="82" text-anchor="middle" class="text-small">Natural language</text>

  <rect x="30" y="110" width="150" height="40" rx="6" class="box-entry"/>
  <text x="105" y="127" text-anchor="middle" class="text-bold">run_sql(sql)</text>
  <text x="105" y="142" text-anchor="middle" class="text-small">SQL statement</text>

  <rect x="30" y="170" width="150" height="40" rx="6" class="box-entry"/>
  <text x="105" y="187" text-anchor="middle" class="text-bold">get_result(uuid)</text>
  <text x="105" y="202" text-anchor="middle" class="text-small">Canonical UUID</text>

  <!-- NL to SQL flow -->
  <line x1="180" y1="70" x2="220" y2="70" class="line"/>
  <rect x="220" y="50" width="120" height="40" rx="6" class="box-process"/>
  <text x="280" y="75" text-anchor="middle" class="text">NL → Plan → SQL</text>
  <line x1="340" y1="70" x2="380" y2="130" class="line"/>

  <!-- SQL direct -->
  <line x1="180" y1="130" x2="380" y2="130" class="line"/>

  <!-- Canonicalize -->
  <polygon points="450,130 380,100 380,160" class="box-process" style="fill:#fff3e0;stroke:#f57c00;"/>
  <text x="405" y="135" text-anchor="middle" class="text-small">Canonicalize</text>
  <text x="405" y="147" text-anchor="middle" class="text-small">→ UUID</text>

  <!-- UUID direct -->
  <line x1="180" y1="190" x2="350" y2="190" class="line"/>
  <line x1="350" y1="190" x2="350" y2="160" class="line"/>
  <line x1="350" y1="160" x2="380" y2="145" class="line"/>

  <!-- To cache check -->
  <line x1="450" y1="130" x2="500" y2="130" class="line"/>
  <polygon points="505,130 495,125 495,135" class="arrow"/>

  <!-- Cache decision -->
  <polygon points="560,130 505,100 505,160 560,130 615,160 615,100" class="box-decision"/>
  <text x="560" y="125" text-anchor="middle" class="text-small">Cache</text>
  <text x="560" y="137" text-anchor="middle" class="text-small">hit?</text>

  <!-- Cache hit -->
  <line x1="615" y1="130" x2="660" y2="130" class="line"/>
  <text x="637" y="122" class="text-small">yes</text>
  <line x1="660" y1="130" x2="660" y2="380" class="line"/>

  <!-- Cache miss -->
  <line x1="560" y1="160" x2="560" y2="200" class="line"/>
  <polygon points="560,205 555,195 565,195" class="arrow"/>
  <text x="572" y="185" class="text-small">no</text>

  <!-- Safety layer -->
  <rect x="480" y="205" width="160" height="40" rx="6" class="box-process"/>
  <text x="560" y="230" text-anchor="middle" class="text-bold">Safety Layer</text>

  <!-- Cost tier decision -->
  <line x1="560" y1="245" x2="560" y2="280" class="line"/>
  <polygon points="560,285 555,275 565,275" class="arrow"/>

  <polygon points="560,320 490,285 490,355 560,320 630,355 630,285" class="box-decision"/>
  <text x="560" y="315" text-anchor="middle" class="text-small">Cost</text>
  <text x="560" y="327" text-anchor="middle" class="text-small">Tier?</text>

  <!-- AUTO -->
  <line x1="490" y1="320" x2="420" y2="320" class="line"/>
  <text x="455" y="312" class="text-small">AUTO</text>
  <rect x="320" y="300" width="100" height="40" rx="6" class="box-process"/>
  <text x="370" y="325" text-anchor="middle" class="text">Execute</text>
  <line x1="370" y1="340" x2="370" y2="380" class="line"/>

  <!-- CONFIRM -->
  <line x1="560" y1="355" x2="560" y2="380" class="line"/>
  <text x="575" y="370" class="text-small">CONFIRM</text>
  <rect x="490" y="380" width="140" height="40" rx="6" class="box-process"/>
  <text x="560" y="405" text-anchor="middle" class="text">Elicit → Execute</text>
  <line x1="490" y1="400" x2="420" y2="400" class="line"/>
  <line x1="420" y1="400" x2="420" y2="380" class="line"/>

  <!-- REJECT -->
  <line x1="630" y1="320" x2="680" y2="320" class="line"/>
  <text x="655" y="312" class="text-small">REJECT</text>
  <line x1="680" y1="320" x2="680" y2="420" class="line"/>
  <line x1="680" y1="420" x2="560" y2="420" class="line"/>
  <polygon points="555,420 565,415 565,425" class="arrow"/>

  <!-- Output -->
  <line x1="370" y1="380" x2="370" y2="420" class="line"/>
  <line x1="660" y1="380" x2="660" y2="420" class="line"/>
  <line x1="370" y1="420" x2="475" y2="420" class="line"/>
  <line x1="660" y1="420" x2="555" y2="420" class="line"/>

  <rect x="475" y="400" width="80" height="40" rx="6" class="box-output"/>
  <text x="515" y="420" text-anchor="middle" class="text-small">Result +</text>
  <text x="515" y="432" text-anchor="middle" class="text-small">UISpec</text>
</svg>
