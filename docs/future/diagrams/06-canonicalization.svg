<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #333; stroke-width: 2; }
      .box-process { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .box-output { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
      .text { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; }
      .text-bold { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; font-weight: bold; }
      .text-small { font-family: system-ui, sans-serif; font-size: 10px; fill: #666; }
      .text-title { font-family: system-ui, sans-serif; font-size: 16px; fill: #333; font-weight: bold; }
      .line { stroke: #333; stroke-width: 1.5; fill: none; }
      .arrow { fill: #333; }
    </style>
  </defs>

  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" class="text-title">SQL Canonicalization</text>

  <!-- SQL text -->
  <rect x="20" y="50" width="80" height="40" rx="6" class="box"/>
  <text x="60" y="75" text-anchor="middle" class="text-bold">SQL text</text>
  <line x1="100" y1="70" x2="130" y2="70" class="line"/>
  <polygon points="135,70 125,65 125,75" class="arrow"/>

  <!-- Parse -->
  <rect x="135" y="50" width="70" height="40" rx="6" class="box-process"/>
  <text x="170" y="75" text-anchor="middle" class="text">Parse</text>
  <line x1="205" y1="70" x2="235" y2="70" class="line"/>
  <polygon points="240,70 230,65 230,75" class="arrow"/>

  <!-- AST -->
  <rect x="240" y="50" width="70" height="40" rx="6" class="box"/>
  <text x="275" y="75" text-anchor="middle" class="text-bold">AST</text>
  <line x1="310" y1="70" x2="340" y2="70" class="line"/>
  <polygon points="345,70 335,65 335,75" class="arrow"/>

  <!-- Normalize -->
  <rect x="345" y="50" width="80" height="40" rx="6" class="box-process"/>
  <text x="385" y="75" text-anchor="middle" class="text">Normalize</text>
  <line x1="425" y1="70" x2="455" y2="70" class="line"/>
  <polygon points="460,70 450,65 450,75" class="arrow"/>

  <!-- Serialize -->
  <rect x="460" y="50" width="70" height="40" rx="6" class="box-process"/>
  <text x="495" y="75" text-anchor="middle" class="text">Serialize</text>
  <line x1="530" y1="70" x2="560" y2="70" class="line"/>
  <polygon points="565,70 555,65 555,75" class="arrow"/>

  <!-- SHA256 -->
  <rect x="565" y="50" width="60" height="40" rx="6" class="box-process"/>
  <text x="595" y="75" text-anchor="middle" class="text">SHA256</text>
  <line x1="625" y1="70" x2="655" y2="70" class="line"/>
  <polygon points="660,70 650,65 650,75" class="arrow"/>

  <!-- UUID -->
  <rect x="660" y="50" width="35" height="40" rx="6" class="box-output"/>
  <text x="677" y="75" text-anchor="middle" class="text-bold">UUID</text>
</svg>
