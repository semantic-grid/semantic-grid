<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <style>
      .state { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .state-start { fill: #333; }
      .state-end { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
      .text { font-family: system-ui, sans-serif; font-size: 11px; fill: #333; }
      .text-bold { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; font-weight: bold; }
      .text-small { font-family: system-ui, sans-serif; font-size: 9px; fill: #666; }
      .text-title { font-family: system-ui, sans-serif; font-size: 16px; fill: #333; font-weight: bold; }
      .line { stroke: #333; stroke-width: 1.5; fill: none; }
      .arrow { fill: #333; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" class="text-title">AG-UI State Machine</text>

  <!-- Start -->
  <circle cx="50" cy="100" r="8" class="state-start"/>
  <line x1="58" y1="100" x2="90" y2="100" class="line"/>
  <polygon points="95,100 85,95 85,105" class="arrow"/>

  <!-- Planning -->
  <rect x="95" y="80" width="90" height="40" rx="6" class="state"/>
  <text x="140" y="105" text-anchor="middle" class="text-bold">planning</text>
  <line x1="185" y1="100" x2="220" y2="100" class="line"/>
  <polygon points="225,100 215,95 215,105" class="arrow"/>

  <!-- Plan Ready -->
  <rect x="225" y="80" width="90" height="40" rx="6" class="state"/>
  <text x="270" y="105" text-anchor="middle" class="text-bold">plan_ready</text>
  <line x1="315" y1="100" x2="350" y2="100" class="line"/>
  <polygon points="355,100 345,95 345,105" class="arrow"/>

  <!-- Awaiting Approval -->
  <rect x="355" y="80" width="120" height="40" rx="6" class="state"/>
  <text x="415" y="100" text-anchor="middle" class="text-bold">awaiting_</text>
  <text x="415" y="112" text-anchor="middle" class="text-bold">approval</text>

  <!-- Approved path -->
  <line x1="475" y1="100" x2="510" y2="100" class="line"/>
  <polygon points="515,100 505,95 505,105" class="arrow"/>
  <text x="492" y="92" class="text-small">approved</text>

  <!-- Rejected path -->
  <line x1="415" y1="120" x2="415" y2="150" class="line"/>
  <line x1="415" y1="150" x2="750" y2="150" class="line"/>
  <line x1="750" y1="150" x2="750" y2="295" class="line"/>
  <polygon points="750,300 745,290 755,290" class="arrow"/>
  <text x="430" y="145" class="text-small">rejected</text>

  <!-- Generating SQL -->
  <rect x="515" y="80" width="110" height="40" rx="6" class="state"/>
  <text x="570" y="100" text-anchor="middle" class="text-bold">generating_</text>
  <text x="570" y="112" text-anchor="middle" class="text-bold">sql</text>
  <line x1="570" y1="120" x2="570" y2="160" class="line"/>
  <polygon points="570,165 565,155 575,155" class="arrow"/>

  <!-- Validating -->
  <rect x="515" y="165" width="110" height="40" rx="6" class="state"/>
  <text x="570" y="190" text-anchor="middle" class="text-bold">validating</text>

  <!-- Repair loop -->
  <line x1="515" y1="185" x2="470" y2="185" class="line"/>
  <line x1="470" y1="185" x2="470" y2="250" class="line"/>
  <line x1="470" y1="250" x2="515" y2="250" class="line"/>
  <polygon points="520,250 510,245 510,255" class="arrow"/>
  <text x="445" y="220" class="text-small">failed</text>

  <!-- Repairing -->
  <rect x="520" y="230" width="100" height="40" rx="6" class="state"/>
  <text x="570" y="255" text-anchor="middle" class="text-bold">repairing</text>
  <line x1="620" y1="250" x2="660" y2="250" class="line"/>
  <line x1="660" y1="250" x2="660" y2="185" class="line"/>
  <line x1="660" y1="185" x2="625" y2="185" class="line"/>
  <polygon points="620,185 630,180 630,190" class="arrow"/>

  <!-- Passed path -->
  <line x1="570" y1="205" x2="570" y2="225" class="line"/>
  <line x1="570" y1="215" x2="690" y2="215" class="line"/>
  <line x1="690" y1="215" x2="690" y2="300" class="line"/>
  <polygon points="690,305 685,295 695,295" class="arrow"/>
  <text x="620" y="210" class="text-small">passed</text>

  <!-- Executing -->
  <rect x="200" y="285" width="100" height="40" rx="6" class="state"/>
  <text x="250" y="310" text-anchor="middle" class="text-bold">executing</text>
  <line x1="300" y1="305" x2="400" y2="305" class="line"/>
  <polygon points="405,305 395,300 395,310" class="arrow"/>

  <!-- Complete -->
  <rect x="405" y="285" width="100" height="40" rx="6" class="state-end"/>
  <text x="455" y="310" text-anchor="middle" class="text-bold">complete</text>

  <!-- End -->
  <line x1="505" y1="305" x2="540" y2="305" class="line"/>
  <circle cx="555" cy="305" r="8" class="state-start"/>
  <circle cx="555" cy="305" r="12" style="fill:none;stroke:#333;stroke-width:2"/>

  <!-- Connection from validating passed to executing -->
  <line x1="690" y1="305" x2="300" y2="305" class="line" style="stroke:#388e3c"/>

  <!-- Rejected end -->
  <circle cx="750" cy="315" r="8" class="state-start"/>
  <circle cx="750" cy="315" r="12" style="fill:none;stroke:#333;stroke-width:2"/>
</svg>
